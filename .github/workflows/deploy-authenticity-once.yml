name: Deploy GNS authenticity once

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-authenticity-deploy.txt"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GNS_CONTRACT_ADDRESS: "0x44a224BF67a4fB17a3a0f0585958dCCc1dfA1AD2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Guard deployer identity
        id: guard
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createAccount } from "genlayer-js";
          const key = process.env.DEPLOYER_PRIVATE_KEY || "";
          const out = process.env.GITHUB_OUTPUT;
          if (!key) {
            console.log("DEPLOYER_SECRET_AVAILABLE=false; no transaction will be sent.");
            fs.appendFileSync(out, "ready=false\n");
            process.exit(0);
          }
          const account = createAccount(key);
          const actual = String(account.address).toLowerCase();
          const expected = "0x231ef01e282385ec2e22394469f1c8c6c28fd6b1";
          console.log(`DEPLOYER_ADDRESS=${actual}`);
          if (actual !== expected) {
            throw new Error(`DEPLOYER_PRIVATE_KEY resolves to ${actual}, expected ${expected}; refusing deployment.`);
          }
          fs.appendFileSync(out, "ready=true\n");
          NODE

      - name: Deploy authenticity contract
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: npm run deploy:authenticity

      - name: Verify deployed contract
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createClient } from "genlayer-js";
          import { studionet } from "genlayer-js/chains";
          const env = fs.readFileSync(".env.local", "utf8");
          const match = env.match(/^NEXT_PUBLIC_GNS_AUTHENTICITY_CONTRACT_ADDRESS=(0x[a-fA-F0-9]{40})$/m);
          if (!match) throw new Error("Authenticity address missing from .env.local after deployment");
          const address = match[1];
          const client = createClient({ chain: studionet });
          async function read(functionName) {
            return client.readContract({ address, functionName, args: [], stateStatus: "finalized" });
          }
          console.log(`AUTHENTICITY_ADDRESS=${address}`);
          console.log(`VERSION=${String(await read("contract_version"))}`);
          console.log(`REGISTRY=${String(await read("get_registry_address"))}`);
          console.log(`POLICY=${String(await read("get_policy_version"))}`);
          NODE
