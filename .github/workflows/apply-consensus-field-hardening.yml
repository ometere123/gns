name: Apply consensus field hardening

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/apply-consensus-field-hardening.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-authenticity-adjudication
          fetch-depth: 0
      - run: python scripts/apply-consensus-field-hardening.py
      - name: Commit hardened state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compare all consensus state fields"
          git push origin HEAD:v2-authenticity-adjudication
