name: Harden authenticity source binding once

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-contract-hardening.txt"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-authenticity-adjudication
      - name: Apply source-binding hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          contract_path = Path("contracts/GNSAuthenticity.py")
          source = contract_path.read_text()

          old = '''    def _attestation_url_authorized(self, url: str, registry_snapshot) -> bool:\n        records = registry_snapshot.get("records", {})\n'''
          new = '''    def _attestation_url_authorized(self, url: str, registry_snapshot) -> bool:\n        lower_url = str(url).lower()\n        if (\n            "/../" in lower_url\n            or "/./" in lower_url\n            or "%2e" in lower_url\n            or "%2f" in lower_url\n            or "%5c" in lower_url\n        ):\n            return False\n        records = registry_snapshot.get("records", {})\n'''
          if old not in source:
              raise SystemExit("authorization patch target not found")
          source = source.replace(old, new, 1)

          old = '''        for source in fetched:\n            if not bool(source.get("ok", False)):\n                continue\n            source_url = str(source.get("url", ""))\n'''
          new = '''        for source in fetched:\n            if not bool(source.get("ok", False)):\n                continue\n            if str(source.get("type", "")) != "attestation":\n                continue\n            source_url = str(source.get("url", ""))\n'''
          if old not in source:
              raise SystemExit("attestation-type patch target not found")
          source = source.replace(old, new, 1)

          marker = '''    def _github_attestation_prefixes(self, github_record: str):\n'''
          helper = '''    def _corroboration_count(self, fetched) -> int:\n        count = 0\n        for item in fetched:\n            if bool(item.get("ok", False)) and str(item.get("type", "")) != "attestation":\n                count += 1\n        return count\n\n'''
          if marker not in source:
              raise SystemExit("corroboration helper insertion target not found")
          source = source.replace(marker, helper + marker, 1)

          old = '''        successful = 0\n        for item in fetched:\n            if bool(item.get("ok", False)):\n                successful += 1\n        claim_type = str(claim.get("claim_type", ""))\n        if claim_type in ["project", "organization", "public_identity"] and successful < 2:\n'''
          new = '''        successful_corroboration = self._corroboration_count(fetched)\n        claim_type = str(claim.get("claim_type", ""))\n        if (\n            claim_type in ["project", "organization", "public_identity"]\n            and successful_corroboration < 1\n        ):\n'''
          if old not in source:
              raise SystemExit("corroboration policy patch target not found")
          source = source.replace(old, new, 1)
          contract_path.write_text(source)

          tests_path = Path("tests/direct/test_authenticity_security.py")
          tests = tests_path.read_text()
          anchor = '''def test_arbitrary_host_cannot_be_ownership_proof(direct_deploy):\n'''
          additions = '''def test_attestation_must_be_typed_as_attestation(direct_deploy):\n    contract = deploy(direct_deploy)\n    source = fetched(\n        "https://meritra.example/.well-known/gns-claim.json",\n        attestation(),\n    )\n    source["type"] = "other"\n    assert check(contract, source)["count"] == 0\n\n\ndef test_github_attestation_rejects_path_traversal(direct_deploy):\n    contract = deploy(direct_deploy)\n    snapshot = registry_snapshot()\n    assert not contract._attestation_url_authorized(\n        "https://raw.githubusercontent.com/ometere123/meritra/../other/main/gns-claim.json",\n        snapshot,\n    )\n    assert not contract._attestation_url_authorized(\n        "https://raw.githubusercontent.com/ometere123/meritra/%2e%2e/other/main/gns-claim.json",\n        snapshot,\n    )\n\n\ndef test_project_corroboration_requires_non_attestation_source(direct_deploy):\n    contract = deploy(direct_deploy)\n    only_attestations = [\n        {"type": "attestation", "ok": True},\n        {"type": "attestation", "ok": True},\n    ]\n    assert contract._corroboration_count(only_attestations) == 0\n    with_corroboration = only_attestations + [{"type": "github", "ok": True}]\n    assert contract._corroboration_count(with_corroboration) == 1\n\n\n'''
          if anchor not in tests:
              raise SystemExit("test insertion target not found")
          tests = tests.replace(anchor, additions + anchor, 1)
          tests_path.write_text(tests)
          PY
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "papitodele"
          git config user.email "45469370+ometere123@users.noreply.github.com"
          git add contracts/GNSAuthenticity.py tests/direct/test_authenticity_security.py
          git diff --cached --check
          git commit -m "fix: harden authenticity source binding"
          git push origin HEAD:v2-authenticity-adjudication
