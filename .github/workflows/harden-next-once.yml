name: Harden Next.js dependency once

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-dependency-harden.txt"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-authenticity-adjudication
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Upgrade patched Next.js maintenance release
        run: npm install --save-exact next@15.5.24 eslint-config-next@15.5.24
      - name: Verify installed versions and audit
        shell: bash
        run: |
          node -e 'console.log("NEXT=" + require("next/package.json").version)'
          node -e 'console.log("ESLINT_CONFIG_NEXT=" + require("eslint-config-next/package.json").version)'
          npm audit --audit-level=high || true
      - name: Build
        run: npm run build
      - name: Commit dependency hardening
        shell: bash
        run: |
          git config user.name "papitodele"
          git config user.email "45469370+ometere123@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: upgrade Next.js to patched 15.5.24"
          git push origin HEAD:v2-authenticity-adjudication
