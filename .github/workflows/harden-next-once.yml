name: Harden frontend dependencies once

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-dependency-harden.txt"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-authenticity-adjudication
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Apply non-breaking npm security fixes
        run: npm audit fix
      - name: Verify patched framework and audit remainder
        shell: bash
        run: |
          node -e 'console.log("NEXT=" + require("next/package.json").version)'
          node -e 'console.log("ESLINT_CONFIG_NEXT=" + require("eslint-config-next/package.json").version)'
          npm audit --audit-level=high || true
      - name: Build
        run: npm run build
      - name: Commit non-breaking dependency fixes
        shell: bash
        run: |
          git config user.name "papitodele"
          git config user.email "45469370+ometere123@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: apply non-breaking npm security updates"
          git push origin HEAD:v2-authenticity-adjudication
