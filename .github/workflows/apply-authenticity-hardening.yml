name: Apply authenticity hardening

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/apply-authenticity-hardening.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2-authenticity-adjudication
          fetch-depth: 0

      - name: Apply one-shot hardening patch
        run: python scripts/apply-authenticity-hardening.py

      - name: Commit hardened state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden challenge burden of proof"
          git push origin HEAD:v2-authenticity-adjudication
