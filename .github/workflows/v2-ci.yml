name: GNS authenticity CI

on:
  push:
    branches:
      - v2-authenticity-adjudication
  pull_request:
    paths:
      - "contracts/GNSAuthenticity.py"
      - "tests/direct/**"
      - "src/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "package*.json"
      - ".github/workflows/v2-ci.yml"

concurrency:
  group: gns-authenticity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GenLayer test toolchain
        run: pip install -r requirements-dev.txt

      - name: GenVM lint authenticity contract
        run: genvm-lint check contracts/GNSAuthenticity.py

      - name: Python syntax check
        run: python -m py_compile contracts/GNSAuthenticity.py

      - name: Direct Mode security tests
        run: pytest tests/direct -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
