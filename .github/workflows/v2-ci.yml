name: GNS v2 CI

on:
  push:
    branches:
      - v2-authenticity-adjudication
  pull_request:
    paths:
      - "contracts/GNSRegistryV2.py"
      - "src/**"
      - "package*.json"
      - ".github/workflows/v2-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GenVM linter
        run: pip install genvm-linter

      - name: GenVM lint and validate v2 contract
        run: genvm-lint check contracts/GNSRegistryV2.py

      - name: Python syntax check
        run: python -m py_compile contracts/GNSRegistryV2.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
