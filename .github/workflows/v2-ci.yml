name: GNS v3 Arc USDC CI

on:
  push:
    branches:
      - v3-arc-usdc
  pull_request:
    paths:
      - "contracts/**"
      - "evm/**"
      - "test/**"
      - "tests/direct/**"
      - "src/**"
      - "scripts/**"
      - "foundry.toml"
      - "requirements-dev.txt"
      - "package*.json"
      - ".github/workflows/v2-ci.yml"
  workflow_dispatch:

concurrency:
  group: gns-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GenLayer test toolchain
        run: pip install -r requirements-dev.txt

      - name: GenVM lint contracts
        run: |
          genvm-lint check contracts/GNSRegistry.py
          genvm-lint check contracts/GNSAuthenticity.py

      - name: Python syntax check
        run: python -m py_compile contracts/GNSRegistry.py contracts/GNSAuthenticity.py

      - name: Direct Mode security tests
        run: pytest tests/direct -v

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge formatting
        run: forge fmt --check

      - name: Build Arc payment router
        run: forge build --sizes

      - name: Test Arc payment router
        run: forge test -vvv

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build
