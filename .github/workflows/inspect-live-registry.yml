name: Inspect live GNS registry

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-live-registry-inspect.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read candidate claim namespaces
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "genlayer-js";
          import { studionet } from "genlayer-js/chains";
          const client = createClient({ chain: studionet });
          const address = "0x44a224BF67a4fB17a3a0f0585958dCCc1dfA1AD2";
          for (const name of ["papito.gen", "papitoai.gen", "meritra.gen", "meritraai.gen"]) {
            try {
              const value = await client.readContract({
                address,
                functionName: "resolve",
                args: [name],
                stateStatus: "finalized"
              });
              console.log(name.toUpperCase().replaceAll(".", "_") + " ", typeof value === "string" ? value : JSON.stringify(value));
            } catch (error) {
              console.log(name, "ERROR", error?.message || String(error));
            }
          }
          NODE
