name: Inspect live GNS registry

on:
  push:
    branches:
      - v2-authenticity-adjudication
    paths:
      - "scripts/trigger-live-registry-inspect.txt"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read active Studionet registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "genlayer-js";
          import { studionet } from "genlayer-js/chains";
          const client = createClient({ chain: studionet });
          const address = "0x44a224BF67a4fB17a3a0f0585958dCCc1dfA1AD2";
          async function read(functionName, args = []) {
            return client.readContract({ address, functionName, args, stateStatus: "finalized" });
          }
          console.log("REGISTRY", address);
          console.log("VERSION", String(await read("contract_version")));
          console.log("TOTAL_NAMES", String(await read("get_total_names")));
          console.log("ADMIN", String(await read("get_admin")));
          console.log("TREASURY", String(await read("get_treasury")));
          const papito = await read("resolve", ["papito902odb.gen"]);
          console.log("PAPITO", typeof papito === "string" ? papito : JSON.stringify(papito));
          NODE
